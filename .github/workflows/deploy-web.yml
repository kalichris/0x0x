name: Deploy Web Panel to VPS

on:
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - "start.py"
      - "requirements.txt"
      - "config.json"
      - "files/**"
      - "Dockerfile.web"
      - "docker-compose.vps.yml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-vps
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name (lowercase owner)
        id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mhddos-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || 'mhddos' }}
      PANEL_SECRET: ${{ secrets.PANEL_SECRET }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
      MHDDOS_WEB_IMAGE: ${{ needs.build.outputs.image }}:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required secrets
        run: |
          set -eu
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY PANEL_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Configure SSH
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set; fetching host keys with ssh-keyscan."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Prepare local deploy files
        run: |
          set -eu
          umask 177
          printf 'MHDDOS_WEB_IMAGE=%s\nPANEL_SECRET=%s\n' "$MHDDOS_WEB_IMAGE" "$PANEL_SECRET" > .deploy.env

      - name: Upload and start panel
        run: |
          set -eu
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_DEPLOY_PATH'"
          scp -P "$VPS_PORT" -o BatchMode=yes \
            docker-compose.vps.yml config.json .deploy.env \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          scp -P "$VPS_PORT" -o BatchMode=yes -r files \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          ssh -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -eu
             cd '$VPS_DEPLOY_PATH'
             mv .deploy.env .env
             chmod 600 .env
             printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             docker compose -f docker-compose.vps.yml pull
             docker compose -f docker-compose.vps.yml up -d
             for i in \$(seq 1 30); do
               if docker compose -f docker-compose.vps.yml exec -T panel \
                 node -e \"fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"; then
                 echo 'Panel is healthy.'
                 exit 0
               fi
               sleep 2
             done
             echo 'Panel health check failed.' >&2
             docker compose -f docker-compose.vps.yml logs --tail=100 panel >&2
             exit 1"

      - name: Success summary
        run: |
          echo "Deployed ${MHDDOS_WEB_IMAGE} to ${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}"
          echo "Open the panel with: ssh -L 5000:127.0.0.1:5000 ${VPS_USER}@${VPS_HOST}"
